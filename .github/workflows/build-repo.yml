name: Build MSYS2 Pacman Repository

on:
  push:
    branches: [main]
    paths:
      - 'PKGBUILDs/**'
      - 'scripts/**'
      - '.github/workflows/build-repo.yml'
      - '.gitattributes'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            base-devel
            git
            dos2unix

      - name: Update MSYS2 package databases
        run: |
          set -e
          pacman -Sy --noconfirm

      - name: Normalize package files to LF
        run: |
          set -e
          find PKGBUILDs scripts -type f \
            \( -name 'PKGBUILD' -o -name '*.sh' \) \
            -exec dos2unix {} +

      - name: Build packages
        run: |
          set -e

          mkdir -p packages/ucrt64
          rm -f packages/ucrt64/*.pkg.tar.zst

          found=0

          for pkgbuild in PKGBUILDs/*/PKGBUILD; do
            [ -f "$pkgbuild" ] || continue

            found=1
            pkgdir="$(dirname "$pkgbuild")"

            echo "==> Building $pkgdir"

            cd "$pkgdir"
            rm -rf src pkg

            makepkg --noconfirm --cleanbuild --clean

            cp ./*.pkg.tar.zst \
              "$GITHUB_WORKSPACE/packages/ucrt64/"

            cd "$GITHUB_WORKSPACE"
          done

          if [ "$found" -eq 0 ]; then
            echo "No PKGBUILDs found."
            exit 1
          fi

      - name: Create Pacman repository database
        run: |
          set -e

          cd packages/ucrt64

          rm -f \
            custom.db \
            custom.db.tar.gz \
            custom.files \
            custom.files.tar.gz

          repo-add custom.db.tar.gz ./*.pkg.tar.zst

          # Make real copies instead of relying on symlinks.
          cp custom.db.tar.gz custom.db
          cp custom.files.tar.gz custom.files

          echo "==> Repository contents:"
          ls -lah

      - name: Prepare GitHub Pages site
        run: |
          set -e

          rm -rf _site
          mkdir -p _site/ucrt64

          cp packages/ucrt64/* _site/ucrt64/

          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Custom MSYS2 Pacman Repository</title>
          </head>
          <body>
            <h1>Custom MSYS2 Pacman Repository 🚀</h1>
            <p>Packages are built for MSYS2 UCRT64.</p>
            <p>Repository: <code>ucrt64</code></p>
          </body>
          </html>
          EOF

          echo "==> Published files:"
          find _site -type f -printf '%p\n'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload repository for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
